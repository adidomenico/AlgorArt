[algokit]
min_version = "v2.0.0"

[project]
type = "library"
name = 'sdk'

[project.run]
build = { commands = ['npm run build'], description = 'Build the SDK' }
test = { commands = ['npm run test'], description = 'Run SDK tests' }
lint = { commands = ['npm run lint'], description = 'Lint TypeScript sources with ESLint' }
format = { commands = ['npm run format'], description = 'Check formatting with Prettier' }
check-types = { commands = ['npm run check-types'], description = 'Type-check TypeScript sources with tsc' }
