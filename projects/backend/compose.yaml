services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: algorart
      POSTGRES_PASSWORD: algorart
      POSTGRES_DB: algorart
    ports:
      - '5432:5432'
    volumes:
      - backend-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U algorart']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend-db:
