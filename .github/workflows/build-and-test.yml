name: build-and-test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Build once: compile contracts (TEAL + generated clients), link the typed
  # clients into the frontend, and build the SDK package. All outputs are
  # gitignored and regenerable; the contract artifacts and linked clients are
  # shared as artifacts instead of being rebuilt by every consumer.
  build:
    name: Build contracts, frontend, and SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Cache each project's node_modules (setup-node keys its cache by a
      # single lockfile path, so one step per project).
      - name: Set up Node.js (contracts cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Set up Node.js (frontend cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/frontend/package-lock.json
      - name: Set up Node.js (sdk cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json

      # The frontend resolves `@kasakame/sdk` as a `file:` dependency with a
      # prebuilt dist/, so build it before the frontend bundle (gitignored,
      # like the other build outputs).
      - name: Install SDK dependencies
        run: npm ci
        working-directory: projects/sdk

      - name: Build SDK package
        run: npm run build
        working-directory: projects/sdk

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Compile contracts (TEAL + generate clients)
        run: npm run build
        working-directory: projects/contracts

      - name: Install frontend dependencies
        run: npm ci
        working-directory: projects/frontend

      # Link the contracts' generated clients into src/contracts (gitignored).
      - name: Link clients into frontend
        run: algokit project link --all
        working-directory: projects/frontend

      # Generated clients contain unused imports that trip noUnusedLocals; tag
      # them so tsc skips them (they must not be edited by hand).
      - name: Tag generated clients with ts-nocheck
        run: node scripts/ts-nocheck-generated.mjs
        working-directory: projects/frontend

      - name: Build frontend bundle (Vite)
        run: npx vite build
        working-directory: projects/frontend

      # Share the two build outputs with the downstream jobs.
      - name: Upload contract artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
          if-no-files-found: error

      - name: Upload linked frontend clients
        uses: actions/upload-artifact@v7
        with:
          name: frontend-clients
          path: projects/frontend/src/contracts
          if-no-files-found: error

  # Pure static checks - no build, no AlgoKit. Symmetric across projects.
  lint-format-type-check:
    name: Lint, format, and type-check (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [contracts, frontend, sdk]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/package-lock.json

      # The frontend's type-check imports the generated clients; bring them in.
      - name: Download frontend clients
        if: matrix.project == 'frontend'
        uses: actions/download-artifact@v8
        with:
          name: frontend-clients
          path: projects/frontend/src/contracts

      - name: Install dependencies
        run: npm ci
        working-directory: projects/${{ matrix.project }}

      # The frontend lane resolves `@kasakame/sdk` (file:../sdk) and needs its
      # built dist/ before type-checking.
      - name: Install and build the SDK
        if: matrix.project == 'frontend'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk

      - name: Lint
        run: npm run lint
        working-directory: projects/${{ matrix.project }}
      - name: Check formatting
        run: npm run format
        working-directory: projects/${{ matrix.project }}
      - name: Type-check
        run: npm run check-types
        working-directory: projects/${{ matrix.project }}

  # Unit tests + coverage - pure Node, symmetric across projects.
  unit-test:
    name: Unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [contracts, frontend, sdk]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/package-lock.json

      # Frontend tests import the generated clients (transaction.ts does).
      - name: Download frontend clients
        if: matrix.project == 'frontend'
        uses: actions/download-artifact@v8
        with:
          name: frontend-clients
          path: projects/frontend/src/contracts

      - name: Install dependencies
        run: npm ci
        working-directory: projects/${{ matrix.project }}

      # The frontend lane resolves `@kasakame/sdk` (file:../sdk) and needs its
      # built dist/ for the tests.
      - name: Install and build the SDK
        if: matrix.project == 'frontend'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk

      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/${{ matrix.project }}

  # Backend lane: lint/format/types plus the suite against a throwaway
  # Postgres. Needs nothing from the build job (no generated clients), so it
  # runs standalone - same workflow so failures stay attributable to the lane.
  backend:
    name: Backend (lint, format, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasakame
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasakame
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/backend
      - name: Run migrations
        run: npm run db:migrate
        working-directory: projects/backend
      - name: Lint
        run: npm run lint
        working-directory: projects/backend
      - name: Check formatting
        run: npm run format
        working-directory: projects/backend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/backend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/backend

  # Deploy + exercise the compiled TEAL on a live LocalNet. Reuses the
  # compiled contract artifacts from the build job instead of recompiling.
  integration-test:
    name: Integration tests (localnet)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Download contract artifacts
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Start LocalNet (algod + indexer)
        run: algokit localnet start

      - name: Run LocalNet integration tests
        run: npm run test:integration
        working-directory: projects/contracts
